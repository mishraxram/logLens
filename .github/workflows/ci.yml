# Runs on every push and pull request: build, typecheck, worker bundle, offline checks, real Loghub logs.
# No secrets needed: the AI eval (tests/eval.ts) and browser e2e are run by hand against a live URL.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run loghub
